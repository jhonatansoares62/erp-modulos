# api-whatsapp/src/main/resources/application.yml
#
# PLAN-04 (Wave 4 da Phase 1): expandido com bloco spring.datasource +
# spring.jpa + spring.flyway, agora que as 4 migrations V1-V4 existem em
# src/main/resources/db/migration/. O `spring.autoconfigure.exclude` que
# vinha de PLAN-02 foi REMOVIDO — Spring Boot agora auto-configura
# DataSource, Hibernate (validate) e Flyway, e o boot do api-whatsapp
# aplica V1..V4 no schema 'whatsapp'.
#
# Boot path em PRODUCAO:
#   1. Connect ao PostgreSQL local 5433 (instalador WinSW garante o servico)
#   2. Flyway aplica V1..V4 (criando schema 'whatsapp' se nao existir,
#      depois clientes_zap/mensagens_log/media_cache/estado_conversa)
#   3. Hibernate valida que entities (Phase 2+) batem com o schema
#   4. WhatsAppProperties valida que os 5 secrets (PLAN-03) estao definidos
#
# Em TEST (application-test.yml): mesmo path, mas com H2 in-memory MODE=PostgreSQL.

server:
  port: ${SERVER_PORT:9193}
  tomcat:
    accesslog:
      # Defesa em profundidade (PITFALLS C-11): query string com hub.verify_token
      # nao deve ser logada nos access logs.
      enabled: false

spring:
  application:
    name: api-whatsapp

  # Datasource: PostgreSQL 15 local (porta 5433, schema 'whatsapp').
  # currentSchema=whatsapp no JDBC URL e defesa em profundidade — caso
  # spring.jpa.properties.hibernate.default_schema nao se aplicar a
  # alguma query nativa, o search_path do PostgreSQL resolve para 'whatsapp'.
  # Defaults erp_mudas/erp_mudas_dev sao pra DEV LOCAL apenas — em producao
  # o instalador WinSW define WHATSAPP_DB_USERNAME/WHATSAPP_DB_PASSWORD via env vars.
  datasource:
    url: ${WHATSAPP_DB_URL:jdbc:postgresql://localhost:5433/erp_mudas?currentSchema=whatsapp}
    username: ${WHATSAPP_DB_USERNAME:erp_mudas}
    password: ${WHATSAPP_DB_PASSWORD:erp_mudas_dev}

  # JPA: ddl-auto: validate (NAO update/create) — schema vem 100% do Flyway.
  # open-in-view: false — anti-pattern em producao (PITFALLS / convencao do monorepo).
  #
  # NOTA (Phase 2 Plan 01): hibernate.default_schema REMOVIDO. Quando ddl-auto:
  # validate roda contra @Entity classes (Phase 2+ adiciona ClienteZap/MensagemLog/
  # MediaCache), Hibernate executa "SELECT * FROM information_schema.sequences"
  # internamente; com default_schema setado, o prefixo gera
  # "whatsapp.information_schema.sequences" que nao existe em H2 nem em PG. As
  # 3 entities ja declaram @Table(schema = "whatsapp", name = "...") explicitamente,
  # portanto cada query JPA prefixa corretamente. O currentSchema=whatsapp no
  # JDBC URL acima fica como defesa em profundidade para queries nativas que
  # nao tenham prefixo (busca search_path do PostgreSQL).
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Flyway: aplica V1..V4 no schema 'whatsapp'.
  # baseline-on-migrate: true permite aplicar contra DB ja existente
  # (operador de cliente que ja tinha o DB do ERP — Flyway cria flyway_schema_history
  # e parte do baseline em vez de falhar).
  # create-schemas: true — Flyway cria o schema se nao existir (defesa em
  # profundidade junto com 'CREATE SCHEMA IF NOT EXISTS whatsapp' na V1).
  flyway:
    enabled: true
    baseline-on-migrate: true
    schemas: whatsapp
    default-schema: whatsapp
    create-schemas: true

  # Spring HTTP client global timeout — defesa em profundidade para MetaMediaClient
  # (sem Resilience4j proprio). RestClient pode ainda override per-instance.
  http:
    client:
      connect-timeout: 5s
      read-timeout: 10s

# Modulo: configuracao especifica do WhatsApp — fail-fast se faltar qualquer um dos 5 secrets.
# Placeholders com colon vazio (${VAR:}) resolvem para string vazia se a env var nao
# estiver setada — string vazia falha @NotBlank em WhatsAppProperties (CFG-01/CFG-02).
app:
  modulos:
    whatsapp:
      phoneNumberId: ${WHATSAPP_PHONE_NUMBER_ID:}
      accessToken: ${WHATSAPP_ACCESS_TOKEN:}
      appSecret: ${WHATSAPP_APP_SECRET:}
      verifyToken: ${WHATSAPP_VERIFY_TOKEN:}
      erpCallbackUrl: ${WHATSAPP_ERP_CALLBACK_URL:}
      callbackTimeout: ${WHATSAPP_CALLBACK_TIMEOUT:5s}
      metaApiBaseUrl: ${WHATSAPP_META_API_BASE_URL:https://graph.facebook.com/v22.0}

# API key de endpoints internos do ERP (Phase 4) — webhook e publico, validado por HMAC
modulo:
  versao: 1.0.0
  api-key: ${API_KEY:}

# OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Logging — alinhado com PITFALLS C-09 / C-11 (sem token / sem query string em logs)
logging:
  level:
    br.com.erpkit.whatsapp: INFO
    # NAO subir org.springframework.web para DEBUG — vaza body, header, query string
    org.springframework.web: INFO

# Actuator (so tem efeito quando spring-boot-starter-actuator entrar no classpath
# em Phase 4/6 com WHATS-17 health check). Defesa em profundidade hoje, ativa amanha.
management:
  endpoint:
    env:
      keys-to-sanitize:
        - password
        - secret
        - key
        - token
        - accessToken
        - appSecret
        - verifyToken

# Resilience4j: circuit breaker + retry para ErpCallbackClient (D-03 + ROU-03 + ROU-04).
#
# Aspect order (Resilience4j Spring Boot starter): Retry POR FORA de CircuitBreaker.
# Significa: 1 dispatch falho = 3 retries (com backoff 1s/2s/4s) = 3 calls counted
# pelo CB sliding-window. 4 dispatches falhos consecutivos = 12 calls = circuit aberto.
#
# retry-exceptions: APENAS transient errors. NAO 4xx categoricos (400/401/403/404 etc.)
# — esses indicam bug de configuracao no ERP, nao falha temporaria; retry duplicaria
# side effect (PITFALLS C-05 / ROU-03 D-08).
resilience4j:
  circuitbreaker:
    instances:
      erp-callback:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: false  # Phase 6 pode habilitar via actuator
  retry:
    instances:
      erp-callback:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2.0
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - java.net.SocketTimeoutException
          - java.io.IOException
        # 4xx categoricos NAO em retry-exceptions — Resilience4j por default NAO retenta
        # excecoes nao listadas. HttpClientErrorException (4xx) NAO retenta.
