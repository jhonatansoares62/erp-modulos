<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitor WhatsApp — api-whatsapp</title>
<style>
  :root {
    --bg:#0b141a; --panel:#111b21; --panel2:#1f2c34; --in:#202c33; --out:#005c4b;
    --txt:#e9edef; --muted:#8696a0; --green:#00a884; --red:#f15c6d; --amber:#f0b232; --blue:#53bdeb;
    --border:#222d34;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); height:100vh; display:flex; flex-direction:column;
         font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  header { background:var(--panel); padding:12px 20px; display:flex; align-items:center; gap:14px;
           flex-wrap:wrap; border-bottom:1px solid var(--border); }
  header h1 { font-size:17px; margin:0; font-weight:600; }
  .badges { display:flex; gap:10px; flex-wrap:wrap; margin-left:auto; align-items:center; }
  .badge { background:var(--panel2); padding:5px 11px; border-radius:20px; font-size:12px; color:var(--muted); white-space:nowrap; }
  .badge b { color:var(--txt); }
  .dot { width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:6px; }
  .dot.ok { background:var(--green); box-shadow:0 0 6px var(--green); } .dot.err { background:var(--red); }
  .cb-CLOSED{color:var(--green);} .cb-OPEN{color:var(--red);} .cb-HALF_OPEN{color:var(--amber);}

  .body { flex:1; display:flex; min-height:0; }
  .sidebar { width:360px; background:var(--panel); border-right:1px solid var(--border); overflow-y:auto; padding:16px; }
  @media (max-width:820px){ .body{flex-direction:column;} .sidebar{width:auto;max-height:50%;} }

  .card { background:var(--panel2); border-radius:10px; padding:14px; margin-bottom:16px; }
  .card h2 { font-size:13px; margin:0 0 12px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); }
  label { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; }
  input, textarea, select {
    width:100%; background:var(--in); border:1px solid var(--border); color:var(--txt);
    border-radius:8px; padding:9px 10px; font-size:14px; font-family:inherit; }
  textarea { resize:vertical; min-height:64px; }
  button { background:var(--green); color:#04231d; border:none; border-radius:8px; padding:10px 14px;
           font-size:14px; font-weight:600; cursor:pointer; width:100%; margin-top:12px; }
  button.sec { background:var(--panel); color:var(--txt); border:1px solid var(--border); }
  button:disabled { opacity:.5; cursor:default; }
  .row { display:flex; gap:8px; } .row input { flex:1; }
  .hide { display:none; }
  .result { margin-top:12px; padding:10px; border-radius:8px; font-size:13px; line-height:1.4; word-break:break-word; }
  .result.ok { background:rgba(0,168,132,.15); border:1px solid var(--green); }
  .result.err { background:rgba(241,92,109,.13); border:1px solid var(--red); }
  .result .lbl { color:var(--muted); font-size:11px; text-transform:uppercase; }
  .diag-line { display:flex; gap:8px; align-items:flex-start; font-size:13px; padding:6px 0; border-top:1px solid var(--border); }
  .diag-line:first-child { border-top:none; }
  .diag-line .k { color:var(--muted); min-width:96px; } .diag-line .v { flex:1; word-break:break-word; }
  .hint { font-size:11px; color:var(--muted); margin-top:6px; }

  main.feed { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:10px;
              background:var(--bg); }
  .empty { color:var(--muted); text-align:center; margin-top:60px; }
  .msg { max-width:78%; padding:8px 12px 6px; border-radius:10px; animation:pop .25s ease; cursor:pointer; }
  .msg.in { background:var(--in); align-self:flex-start; border-top-left-radius:3px; }
  .msg.out { background:var(--out); align-self:flex-end; border-top-right-radius:3px; }
  .msg.new { outline:2px solid var(--green); }
  @keyframes pop { from{transform:translateY(6px);opacity:0;} to{transform:none;opacity:1;} }
  .meta { font-size:11px; color:var(--muted); margin-bottom:3px; display:flex; gap:8px; align-items:center; }
  .msg.out .meta { color:#afeee0; }
  .tipo { background:rgba(255,255,255,.12); padding:1px 6px; border-radius:4px; font-size:10px; text-transform:uppercase; }
  .tel { font-weight:600; } .conteudo { font-size:14.5px; line-height:1.35; white-space:pre-wrap; }
  .conteudo.vazio { color:var(--muted); font-style:italic; }
  .time { font-size:10.5px; color:var(--muted); text-align:right; margin-top:2px; } .msg.out .time{color:#8fd9c9;}
</style>
</head>
<body>
  <header>
    <h1>📱 Monitor WhatsApp</h1>
    <div class="badges">
      <span class="badge"><span id="conn" class="dot err"></span><span id="connTxt">conectando…</span></span>
      <span class="badge">Número: <b id="phone">—</b></span>
      <span class="badge">Circuit: <b id="cb" class="cb-UNKNOWN">—</b></span>
      <span class="badge">Total: <b id="total">0</b></span>
    </div>
  </header>

  <div class="body">
    <aside class="sidebar">
      <!-- Enviar teste -->
      <div class="card">
        <h2>🧪 Enviar teste</h2>
        <label>Telefone (wa_id, com DDI 55 e o 9)</label>
        <input id="tel" placeholder="5546920009012">
        <label>Tipo</label>
        <select id="tipo" onchange="toggleBotoes()">
          <option value="texto">Texto</option>
          <option value="botoes">Botões</option>
        </select>
        <label>Mensagem</label>
        <textarea id="txt" placeholder="Olá! Mensagem de teste do painel.">Olá! Mensagem de teste do painel.</textarea>
        <div id="botoesBox" class="hide">
          <label>Botões (id | título) — até 3</label>
          <div class="row"><input class="btid" placeholder="id1" value="confirmar"><input class="bttit" placeholder="título" value="Confirmar"></div>
          <div class="row" style="margin-top:6px"><input class="btid" placeholder="id2" value="remarcar"><input class="bttit" placeholder="título" value="Remarcar"></div>
        </div>
        <button id="btnEnviar" onclick="enviar()">Enviar</button>
        <div class="hint">Só entrega dentro da janela de 24h (o cliente precisa ter escrito antes).</div>
        <div id="envResult"></div>
      </div>

      <!-- Diagnóstico -->
      <div class="card">
        <h2>🔧 Diagnóstico</h2>
        <button class="sec" id="btnDiag" onclick="diagnostico()">Rodar diagnóstico</button>
        <div id="diagResult"></div>
      </div>
    </aside>

    <main class="feed" id="feed">
      <div class="empty" id="empty">Aguardando mensagens… envie algo pro número de teste 📩</div>
    </main>
  </div>

<script>
  const seen = new Set(); let firstLoad = true;
  const $ = id => document.getElementById(id);
  const esc = s => s==null ? "" : s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const hora = ms => !ms ? "" : new Date(ms).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit",second:"2-digit"});

  function toggleBotoes(){ $("botoesBox").classList.toggle("hide", $("tipo").value!=="botoes"); }

  async function enviar(){
    const btn=$("btnEnviar"), out=$("envResult");
    const body={ telefone:$("tel").value.trim(), tipo:$("tipo").value, texto:$("txt").value };
    if($("tipo").value==="botoes"){
      const ids=[...document.querySelectorAll(".btid")], tits=[...document.querySelectorAll(".bttit")];
      body.botoes=ids.map((el,i)=>({id:el.value.trim(),title:tits[i].value.trim()})).filter(b=>b.id&&b.title);
    }
    if(!body.telefone){ out.className="result err"; out.innerHTML="Informe o telefone."; return; }
    btn.disabled=true; out.className="result"; out.textContent="enviando…";
    try{
      const r=await fetch("/monitor/enviar",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
      const d=await r.json();
      if(d.ok){ out.className="result ok"; out.innerHTML='<div class="lbl">Enviado ✓</div>wamid: '+esc(d.wamid); }
      else { out.className="result err";
        out.innerHTML='<div class="lbl">Falhou ✗</div>'+
          (d.codigo?'<b>'+esc(d.codigo)+'</b>':'')+(d.metaErrorCode!=null?' (Meta '+d.metaErrorCode+')':'')+
          '<br>'+esc(d.mensagem); }
    }catch(e){ out.className="result err"; out.innerHTML='<div class="lbl">Erro</div>'+esc(String(e)); }
    finally{ btn.disabled=false; }
  }

  async function diagnostico(){
    const btn=$("btnDiag"), out=$("diagResult");
    btn.disabled=true; out.innerHTML='<div class="diag-line"><span class="v">rodando…</span></div>';
    try{
      const d=await (await fetch("/monitor/diagnostico")).json();
      const chk=c=>'<span class="dot '+(c.ok?"ok":"err")+'"></span>'+esc(c.detalhe);
      out.innerHTML=
        line("Número", esc(d.phoneNumberId))+
        line("Graph API", esc(d.metaApiBaseUrl))+
        line("ERP callback", esc(d.erpCallbackUrl))+
        line("API key", d.apiKeyConfigurada?"configurada":"(vazia)")+
        line("Circuit", '<span class="cb-'+d.circuitBreakerState+'">'+d.circuitBreakerState+'</span>')+
        line("Meta", chk(d.meta))+
        line("ERP", chk(d.erp));
    }catch(e){ out.innerHTML='<div class="diag-line"><span class="v">Erro: '+esc(String(e))+'</span></div>'; }
    finally{ btn.disabled=false; }
  }
  const line=(k,v)=>'<div class="diag-line"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>';

  async function tick(){
    try{
      const d=await (await fetch("/monitor/feed",{cache:"no-store"})).json();
      $("conn").className="dot ok"; $("connTxt").textContent="ao vivo";
      $("phone").textContent=d.phoneNumberId||"—";
      const cb=$("cb"); cb.textContent=d.circuitBreakerState||"—"; cb.className="cb-"+(d.circuitBreakerState||"UNKNOWN");
      $("total").textContent=d.total??0;
      const feed=$("feed"), empty=$("empty");
      const novas=(d.mensagens||[]).filter(m=>!seen.has(m.id));
      if(novas.length&&empty) empty.remove();
      for(const m of novas.slice().reverse()){
        seen.add(m.id);
        const dir=m.direcao==="out"?"out":"in";
        const el=document.createElement("div");
        el.className="msg "+dir+(firstLoad?"":" new");
        el.title="Clique para responder a este número";
        el.onclick=()=>{ $("tel").value=m.telefone; };
        el.innerHTML='<div class="meta"><span>'+(dir==="out"?"➡️ enviada":"⬅️ recebida")+'</span>'+
          '<span class="tel">'+esc(m.telefone)+'</span><span class="tipo">'+esc(m.tipo||"?")+'</span></div>'+
          '<div class="conteudo'+(m.conteudo?'':' vazio')+'">'+(m.conteudo?esc(m.conteudo):"(sem texto)")+'</div>'+
          '<div class="time">'+hora(m.criadoEm)+'</div>';
        feed.insertBefore(el,feed.firstChild);
        if(!firstLoad) setTimeout(()=>el.classList.remove("new"),2500);
      }
      firstLoad=false;
    }catch(e){ $("conn").className="dot err"; $("connTxt").textContent="sem conexão"; }
  }
  tick(); setInterval(tick,1500);
</script>
</body>
</html>
