# api-whatsapp/src/test/resources/application-test.yml
#
# PLAN-04 (Wave 4 da Phase 1): expandido com H2 in-memory em modo PostgreSQL.
# O `spring.autoconfigure.exclude` que vinha de PLAN-03 foi REMOVIDO — agora
# Spring Boot auto-configura DataSource (H2), Hibernate (validate sobre H2Dialect)
# e Flyway, e o boot do test aplica V1..V4 no schema 'whatsapp' do H2.
#
# Por que H2 modo PostgreSQL:
#   * SQL portavel: as 4 migrations rodam IDENTICAS em H2 e em PostgreSQL real
#     (BIGINT GENERATED ALWAYS AS IDENTITY, NOW(), CHECK (direcao IN (...)),
#      CREATE SCHEMA IF NOT EXISTS whatsapp).
#   * Sem Testcontainers em Phase 1 — H2 e suficiente; Phase 6 pode adicionar
#     TC para PG-real coverage se descobrir gap.
#   * Empiricamente validado em H2 2.3.232 (Spring Boot 3.5.9 BOM) no spike STEP 0.
#
# Params do JDBC URL (criticos):
#   * MODE=PostgreSQL — H2 emula sintaxe PG (BIGINT GENERATED, NOW(), CHECK, etc).
#   * DATABASE_TO_UPPER=false — preserve identifiers em lowercase (essencial para
#     'clientes_zap' casar com a query do Hibernate; sem isso H2 default upper).
#   * CASE_INSENSITIVE_IDENTIFIERS=true — match case-insensitivo entre query e schema.
#   * DB_CLOSE_DELAY=-1 — DB vivo entre testes do mesmo SpringContext (cache de contexto
#     do SpringBootTest reutiliza o mesmo H2 entre @Test methods).
#   * INIT=CREATE SCHEMA IF NOT EXISTS whatsapp — schema criado ANTES de Flyway
#     tentar abrir conexao. Defesa em profundidade junto com flyway.create-schemas.

spring:
  datasource:
    url: jdbc:h2:mem:testdb_whatsapp;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS whatsapp
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    database-platform: org.hibernate.dialect.H2Dialect
    # NOTA (Phase 2 Plan 01): hibernate.default_schema REMOVIDO de proposito.
    # Quando ddl-auto: validate roda contra @Entity classes, Hibernate executa
    # "SELECT * FROM information_schema.sequences" internamente. Em H2 com
    # DATABASE_TO_UPPER=false, esse lookup falha com "Schema information_schema
    # not found" pois H2 system schema e UPPERCASE. As 3 entities (ClienteZap,
    # MensagemLog, MediaCache) ja declaram @Table(schema = "whatsapp", name = "...")
    # explicitamente, portanto cada query JPA prefixa corretamente sem precisar
    # de default_schema.
    #
    # boot.allow_jdbc_metadata_access: false desabilita o pre-fetch de metadata
    # via JDBC (incluindo o problematico information_schema.sequences). Hibernate
    # 6.4+ honra essa flag — schema validation usa apenas o mapping declarativo
    # das @Entity classes, ja que o schema vem 100% do Flyway (validate, nao
    # update). Sequences nao sao usadas (entities usam @GeneratedValue IDENTITY).
    properties:
      "[hibernate.boot.allow_jdbc_metadata_access]": "false"

  flyway:
    enabled: true
    baseline-on-migrate: true
    schemas: whatsapp
    default-schema: whatsapp
    create-schemas: true

  # Timeouts globais curtos para tests rapidos (defesa em profundidade para MetaMediaClient).
  http:
    client:
      connect-timeout: 200ms
      read-timeout: 500ms

# Dummy values para Bean Validation passar sem env vars reais. Tests que precisem
# de valores reais (ex: HmacValidatorTest com appSecret real em PLAN-05) podem
# sobrescrever via @SpringBootTest(properties = {...}) ou @TestPropertySource.
app:
  modulos:
    whatsapp:
      phoneNumberId: test-phone-id
      accessToken: test-access-token
      appSecret: test-app-secret
      verifyToken: test-verify-token
      erpCallbackUrl: http://localhost:0/test
      # Wave 4 (PLAN 03-04): callbackTimeout 500ms necessario para
      # ErpCallbackClientTest.timeout_retry_e_fallback (delay 1500ms > timeout
      # 500ms). Phase 1+2 tests nao chamam callback ERP — sem regressao.
      callbackTimeout: 500ms
      # Override para tests — placeholder substituido por WireMock URL via @DynamicPropertySource em Wave 3.
      metaApiBaseUrl: http://localhost:0/test

modulo:
  versao: 1.0.0-test
  api-key: test-key

# Resilience4j com janelas curtas para tests (Wave 4 alguns tests podem precisar override per-class).
resilience4j:
  circuitbreaker:
    instances:
      erp-callback:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 1s
        permitted-number-of-calls-in-half-open-state: 3
      # NOVO Phase 4: espelho de erp-callback para WhatsAppCloudClient (04-04). Mesma
      # config de tests rapidos (wait-duration-in-open-state: 1s vs 60s prod).
      whatsapp-cloud:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 1s
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    instances:
      erp-callback:
        max-attempts: 3
        wait-duration: 50ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2.0
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
          - java.net.SocketTimeoutException
          - java.io.IOException
      # NOVO Phase 4: espelho de erp-callback. wait-duration: 50ms (vs 1s prod) para
      # tests rapidos — total max retry < 200ms (50 + 100 + 200ms exponencial).
      whatsapp-cloud:
        max-attempts: 3
        wait-duration: 50ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2.0
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
          - java.net.SocketTimeoutException
          - java.io.IOException
