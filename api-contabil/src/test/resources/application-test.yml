# Teste: H2 in-memory em modo PostgreSQL. A migration V1 roda idêntica em H2 e PG.
# Params críticos do JDBC URL: MODE=PostgreSQL (emula sintaxe PG), DATABASE_TO_LOWER
# (identifiers lowercase), CASE_INSENSITIVE_IDENTIFIERS, DB_CLOSE_DELAY=-1 (DB vivo
# entre @Test do mesmo contexto), INIT=CREATE SCHEMA (schema antes do Flyway).
spring:
  datasource:
    url: jdbc:h2:mem:testdb_contabil;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS contabil
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      "[hibernate.boot.allow_jdbc_metadata_access]": "false"

  flyway:
    enabled: true
    baseline-on-migrate: true
    schemas: contabil
    default-schema: contabil
    create-schemas: true

modulo:
  versao: 0.1.0-test
  api-key: test-key
