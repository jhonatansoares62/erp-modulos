# Teste = produção: Postgres real via Testcontainers (postgres:15, mesma major do homolog). O datasource
# vem do container (AbstractPostgresIT via @DynamicPropertySource) e o Flyway roda as migrations NATIVAS
# (V1..Vn) do zero no schema contabil. Sem H2, sem drift de checksum; dialeto Postgres auto-detectado.
spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    schemas: contabil
    default-schema: contabil
    create-schemas: true

modulo:
  versao: 0.1.0-test
  api-key: test-key
