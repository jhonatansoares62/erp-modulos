<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px;">
    <h2 style="color: #333;">Lembrete de Consulta</h2>
    <p>Olá <span th:text="${clienteNome}">Cliente</span>,</p>
    <p>Passando para lembrar da sua consulta:</p>
    <table style="width: 100%; border-collapse: collapse; margin: 20px 0;">
        <tr style="background: #f5f5f5;">
            <td style="padding: 10px; border: 1px solid #ddd;"><strong>Data e hora</strong></td>
            <td style="padding: 10px; border: 1px solid #ddd;" th:text="${dataHora}">00/00/0000 às 00:00</td>
        </tr>
        <tr th:if="${profissional != null and !#strings.isEmpty(profissional)}">
            <td style="padding: 10px; border: 1px solid #ddd;"><strong>Profissional</strong></td>
            <td style="padding: 10px; border: 1px solid #ddd;" th:text="${profissional}">Dr(a).</td>
        </tr>
        <tr style="background: #f5f5f5;" th:if="${tipo != null and !#strings.isEmpty(tipo)}">
            <td style="padding: 10px; border: 1px solid #ddd;"><strong>Tipo</strong></td>
            <td style="padding: 10px; border: 1px solid #ddd;" th:text="${tipo}">Consulta</td>
        </tr>
    </table>
    <p>Se não puder comparecer, entre em contato para reagendar.</p>
    <p th:if="${nomeEmpresa != null and !#strings.isEmpty(nomeEmpresa)}" style="color: #333; font-size: 13px; margin-top: 24px;">
        <strong th:text="${nomeEmpresa}">Empresa</strong>
        <span th:if="${telefoneEmpresa != null and !#strings.isEmpty(telefoneEmpresa)}" th:text="' — ' + ${telefoneEmpresa}"></span>
    </p>
    <p style="color: #666; font-size: 12px;">Este é um e-mail automático, não responda.</p>
</body>
</html>
