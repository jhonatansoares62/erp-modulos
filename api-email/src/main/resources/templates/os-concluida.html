<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px;">
    <!-- titulo/mensagem: o sistema chamador personaliza (ex.: "Atendimento Concluído" no consultório). -->
    <h2 style="color: #333;" th:text="${titulo != null and !#strings.isEmpty(titulo)} ? ${titulo} : 'Ordem de Serviço Concluída'">Ordem de Serviço Concluída</h2>
    <p>Olá <span th:text="${clienteNome}">Cliente</span>,</p>
    <p th:text="${mensagem != null and !#strings.isEmpty(mensagem)} ? ${mensagem} : 'Sua ordem de serviço foi concluída com sucesso!'">Sua ordem de serviço foi concluída com sucesso!</p>
    <table style="width: 100%; border-collapse: collapse; margin: 20px 0;">
        <tr style="background: #f5f5f5;">
            <td style="padding: 10px; border: 1px solid #ddd;"><strong>Número</strong></td>
            <td style="padding: 10px; border: 1px solid #ddd;" th:text="${osNumero}">OS-0000-000</td>
        </tr>
        <tr>
            <td style="padding: 10px; border: 1px solid #ddd;"><strong>Data</strong></td>
            <td style="padding: 10px; border: 1px solid #ddd;" th:text="${dataAgenda}">00/00/0000</td>
        </tr>
        <tr style="background: #f5f5f5;" th:if="${endereco != null and !#strings.isEmpty(endereco)}">
            <td style="padding: 10px; border: 1px solid #ddd;"><strong>Endereço</strong></td>
            <td style="padding: 10px; border: 1px solid #ddd;" th:text="${endereco}">Endereço</td>
        </tr>
    </table>
    <p>Agradecemos a preferência! Em caso de dúvidas, entre em contato conosco.</p>
    <p th:if="${nomeEmpresa != null and !#strings.isEmpty(nomeEmpresa)}" style="color: #333; font-size: 13px; margin-top: 24px;">
        <strong th:text="${nomeEmpresa}">Empresa</strong>
        <span th:if="${telefoneEmpresa != null and !#strings.isEmpty(telefoneEmpresa)}" th:text="' — ' + ${telefoneEmpresa}"></span>
    </p>
    <p style="color: #666; font-size: 12px;">Este é um e-mail automático, não responda.</p>
</body>
</html>
