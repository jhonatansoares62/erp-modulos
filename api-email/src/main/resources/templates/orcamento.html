<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px;">
    <h2 style="color: #333;">Seu Orçamento</h2>
    <p>Olá <span th:text="${clienteNome}">Cliente</span>,</p>
    <p>Segue em anexo o orçamento <strong th:text="${orcamentoNumero}">000</strong> conforme solicitado.</p>
    <table style="width: 100%; border-collapse: collapse; margin: 20px 0;">
        <tr style="background: #f5f5f5;">
            <td style="padding: 10px; border: 1px solid #ddd;"><strong>Valor Total</strong></td>
            <td style="padding: 10px; border: 1px solid #ddd;" th:text="${valorTotal}">R$ 0,00</td>
        </tr>
        <tr th:if="${dataValidade != null and !#strings.isEmpty(dataValidade)}">
            <td style="padding: 10px; border: 1px solid #ddd;"><strong>Validade</strong></td>
            <td style="padding: 10px; border: 1px solid #ddd;" th:text="${dataValidade}">00/00/0000</td>
        </tr>
    </table>
    <p>Ficamos à disposição para dúvidas ou para agendar seu atendimento.</p>
    <p th:if="${nomeEmpresa != null and !#strings.isEmpty(nomeEmpresa)}" style="color: #333; font-size: 13px; margin-top: 24px;">
        <strong th:text="${nomeEmpresa}">Empresa</strong>
        <span th:if="${telefoneEmpresa != null and !#strings.isEmpty(telefoneEmpresa)}" th:text="' — ' + ${telefoneEmpresa}"></span>
    </p>
    <p style="color: #666; font-size: 12px;">Este é um e-mail automático, não responda.</p>
</body>
</html>
