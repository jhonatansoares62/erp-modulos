<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px;">
    <h2 style="color: #333;" th:text="${titulo != null and !#strings.isEmpty(titulo)} ? ${titulo} : 'Ordem de Serviço Cancelada'">Ordem de Serviço Cancelada</h2>
    <p>Olá <span th:text="${clienteNome}">Cliente</span>,</p>
    <p>Informamos que <strong th:text="${osNumero}">000</strong> foi cancelado(a).</p>
    <p th:text="${mensagem != null and !#strings.isEmpty(mensagem)} ? ${mensagem} : 'Caso tenha dúvidas sobre o cancelamento ou deseje reagendar, entre em contato conosco.'">Caso tenha dúvidas sobre o cancelamento ou deseje reagendar, entre em contato conosco.</p>
    <p th:if="${nomeEmpresa != null and !#strings.isEmpty(nomeEmpresa)}" style="color: #333; font-size: 13px; margin-top: 24px;">
        <strong th:text="${nomeEmpresa}">Empresa</strong>
        <span th:if="${telefoneEmpresa != null and !#strings.isEmpty(telefoneEmpresa)}" th:text="' — ' + ${telefoneEmpresa}"></span>
    </p>
    <p style="color: #666; font-size: 12px;">Este é um e-mail automático, não responda.</p>
</body>
</html>
